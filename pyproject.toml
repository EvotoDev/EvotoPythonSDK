[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evoto-plugin-sdk"
dynamic = ["version"]
description = "Evoto Plugin SDK for Python plugin development"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Evoto Team" },
]
license = { text = "MIT" }
dependencies = []
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
docs = [
  "mkdocs>=1.6,<2.0",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.27",
  "mkdocs-gen-files>=0.5",
  "pymdown-extensions>=10.7",
  "pathspec>=0.10",
]
demo = [
  "PySide6>=6.5",
]

[project.urls]
Documentation = "https://github.com/evoto-dev/EvotoPythonSDK"
Source = "https://github.com/evoto-dev/EvotoPythonSDK"

[tool.setuptools.packages.find]
include = ["evoto", "evoto.*"]

[tool.setuptools.dynamic]
version = { attr = "evoto.core.version.SDK_VERSION" }
